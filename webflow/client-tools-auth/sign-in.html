<!--
  REVREBEL Client Tools Clerk sign-in
  Webflow page: /client-hub/sign-in

  Requires a div with id="clerk-sign-in".
  Replace REPLACE_WITH_CLERK_PUBLISHABLE_KEY before publishing.
-->
<script>
(() => {
  const CLERK_PUBLISHABLE_KEY = "REPLACE_WITH_CLERK_PUBLISHABLE_KEY";
  const SIGN_IN_URL = "/client-hub/sign-in";
  const HUB_URL = "/client-hub";

  if (
    !CLERK_PUBLISHABLE_KEY.startsWith("pk_") ||
    CLERK_PUBLISHABLE_KEY.includes("REPLACE_WITH")
  ) {
    console.warn("[Client Tools Sign In] Clerk publishable key has not been configured yet.");
    return;
  }

  const loadScript = (src, attributes = {}) =>
    new Promise((resolve, reject) => {
      const existing = document.querySelector('script[src="' + src + '"]');

      if (existing) {
        if (existing.dataset.clientToolsLoaded === "true") {
          resolve();
          return;
        }

        existing.addEventListener("load", resolve, { once: true });
        existing.addEventListener("error", reject, { once: true });
        return;
      }

      const script = document.createElement("script");
      script.src = src;
      script.async = true;
      script.crossOrigin = "anonymous";

      Object.entries(attributes).forEach(([name, value]) => {
        script.setAttribute(name, value);
      });

      script.addEventListener(
        "load",
        () => {
          script.dataset.clientToolsLoaded = "true";
          resolve();
        },
        { once: true },
      );
      script.addEventListener("error", reject, { once: true });
      document.head.appendChild(script);
    });

  (async () => {
    try {
      const clerkDomain = atob(CLERK_PUBLISHABLE_KEY.split("_")[2]).slice(0, -1);

      await loadScript(
        "https://" + clerkDomain + "/npm/@clerk/ui@1/dist/ui.browser.js",
      );
      await loadScript(
        "https://" + clerkDomain + "/npm/@clerk/clerk-js@6/dist/clerk.browser.js",
        { "data-clerk-publishable-key": CLERK_PUBLISHABLE_KEY },
      );

      await window.Clerk.load({
        ui: { ClerkUI: window.__internal_ClerkUICtor },
        appearance: {
          options: {
            logoImageUrl: "https://res.cloudinary.com/revrebel/image/upload/v1761516148/RR/Logos/revrebel-logo.png",
            socialButtonsPlacement: "top",
            socialButtonsVariant: "blockButton",
            elevation: "raised",
          },
          variables: {
            colorPrimary: "#163666",
            colorPrimaryForeground: "#eff5f6",
            colorForeground: "#163666",
            colorMutedForeground: "#536782",
            colorBackground: "#eff5f6",
            colorInput: "#ffffff",
            colorInputForeground: "#163666",
            colorNeutral: "#163666",
            colorBorder: "#163666",
            colorRing: "#163666",
            colorDanger: "#e05047",
            colorSuccess: "#71c9c5",
            colorWarning: "#faca78",
            borderRadius: "0.175rem",
            spacing: "1rem",
            fontFamily: "Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif",
            fontFamilyButtons: "Khand, 'Arial Narrow', sans-serif",
          },
          elements: {
            rootBox: { width: "100%", maxWidth: "480px" },
            cardBox: {
              width: "100%",
              maxWidth: "480px",
              overflow: "hidden",
              backgroundColor: "var(--clerk-color-background)",
              border: "3px solid var(--clerk-color-ring)",
              borderRadius: "0.55rem",
              boxShadow: "0 8px 20px rgba(0, 0, 0, 0.06)",
            },
            card: {
              backgroundColor: "var(--clerk-color-background)",
              border: "0",
              borderRadius: "0",
              boxShadow: "none",
            },
            logoBox: { marginBottom: "1.35rem" },
            logoImage: { width: "190px", maxWidth: "72%", height: "auto" },
            header: { paddingTop: "0.25rem" },
            headerTitle: {
              color: "#163666",
              fontFamily: "Khand, 'Arial Narrow', sans-serif",
              fontSize: "1.9rem",
              fontWeight: 700,
              lineHeight: 1,
              letterSpacing: "-0.015em",
              textTransform: "uppercase",
            },
            headerSubtitle: {
              maxWidth: "340px",
              marginInline: "auto",
              color: "#536782",
              fontSize: "0.9rem",
              fontWeight: 500,
              lineHeight: 1.45,
              letterSpacing: "0.025em",
            },
            socialButtonsBlockButton: {
              minHeight: "42px",
              backgroundColor: "#ffffff",
              color: "#163666",
              border: "1px solid rgba(22, 54, 102, 0.32)",
              borderRadius: "0.175rem",
              boxShadow: "none",
              fontWeight: 500,
            },
            dividerLine: { backgroundColor: "rgba(22, 54, 102, 0.16)" },
            dividerText: { color: "#536782", fontSize: "0.82rem" },
            formFieldLabel: {
              color: "#163666",
              fontSize: "0.82rem",
              fontWeight: 600,
            },
            formFieldInput: {
              minHeight: "44px",
              backgroundColor: "#ffffff",
              color: "#163666",
              border: "1px solid #163666",
              borderRadius: "0.175rem",
              boxShadow: "none",
              fontSize: "0.9rem",
              "&:focus": {
                borderColor: "#163666",
                boxShadow: "0 0 0 2px rgba(22, 54, 102, 0.12)",
              },
            },
            formButtonPrimary: {
              minHeight: "58px",
              backgroundColor: "#163666",
              color: "#eff5f6",
              borderRadius: "0.175rem",
              boxShadow: "none",
              fontFamily: "Khand, 'Arial Narrow', sans-serif",
              fontSize: "1.08rem",
              fontWeight: 700,
              letterSpacing: "0.02em",
              textTransform: "uppercase",
              "&:hover, &:focus, &:active": { backgroundColor: "#0d274e" },
            },
            footer: {
              backgroundColor: "rgba(22, 54, 102, 0.035)",
              borderTop: "1px solid #163666",
            },
            footerAction: {
              paddingBlock: "1rem",
              borderBottom: "1px solid rgba(22, 54, 102, 0.42)",
            },
            footerActionText: { color: "#536782", fontSize: "0.82rem" },
            footerActionLink: {
              color: "#163666",
              fontFamily: "Khand, 'Arial Narrow', sans-serif",
              fontSize: "0.9rem",
              fontWeight: 700,
              letterSpacing: "0.025em",
              textTransform: "uppercase",
            },
            footerPages: { paddingBlock: "0.85rem", color: "#536782" },
          },
        },
        signInUrl: SIGN_IN_URL,
        signInForceRedirectUrl: HUB_URL,
        signInFallbackRedirectUrl: HUB_URL,
      });

      const params = new URLSearchParams(window.location.search);

      if (params.get("signout") === "1" && window.Clerk.isSignedIn) {
        await window.Clerk.signOut({ redirectUrl: SIGN_IN_URL });
        return;
      }

      if (window.Clerk.isSignedIn) {
        window.location.replace(HUB_URL);
        return;
      }

      const mount = document.getElementById("clerk-sign-in");
      if (!mount) {
        throw new Error("Missing #clerk-sign-in mount element.");
      }

      window.Clerk.mountSignIn(mount, {
        routing: "hash",
        forceRedirectUrl: HUB_URL,
        fallbackRedirectUrl: HUB_URL,
        withSignUp: false,
      });
    } catch (error) {
      console.error("[Client Tools Sign In] Clerk failed to initialize.", error);
      const mount = document.getElementById("clerk-sign-in");
      if (mount) {
        mount.textContent =
          "Sign in is temporarily unavailable. Please refresh the page.";
      }
    }
  })();
})();
</script>
