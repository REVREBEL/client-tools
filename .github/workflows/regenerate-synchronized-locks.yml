name: Regenerate synchronized locks

on:
  push:
    branches:
      - chore/unify-pnpm-npm-lock-validation
    paths:
      - ".github/workflows/regenerate-synchronized-locks.yml"

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chore/unify-pnpm-npm-lock-validation
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 12.18.0
          run_install: false
      - name: Synchronize locks from pnpm
        run: pnpm run locks:sync
      - name: Commit synchronized locks
        run: |
          if git diff --quiet -- pnpm-lock.yaml apps/*/package-lock.json; then
            echo "No lockfile changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml apps/*/package-lock.json
          git commit -m "Regenerate npm locks from pnpm resolutions"
          git push origin HEAD:chore/unify-pnpm-npm-lock-validation
