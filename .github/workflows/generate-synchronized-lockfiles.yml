name: Generate synchronized app lockfiles

on:
  push:
    branches:
      - chore/unify-pnpm-npm-lock-validation
    paths:
      - "package.json"
      - "scripts/lockfiles.mjs"
      - ".github/workflows/generate-synchronized-lockfiles.yml"

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: chore/unify-pnpm-npm-lock-validation

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.18.0
          run_install: false

      - name: Synchronize pnpm and npm lockfiles
        run: pnpm run locks:sync

      - name: Commit synchronized lockfiles
        run: |
          if git diff --quiet -- pnpm-lock.yaml apps/*/package-lock.json; then
            echo "Lockfiles already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml apps/*/package-lock.json
          git commit -m "Synchronize pnpm and npm lockfiles"
          git push origin HEAD:chore/unify-pnpm-npm-lock-validation
