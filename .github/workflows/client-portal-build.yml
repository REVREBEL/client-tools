name: Client Portal Build

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "portal/**"
      - "public/**"
      - "package.json"
      - "next.config.ts"
      - "webflow.json"
      - "wrangler.json"
      - "tsconfig.json"
      - "postcss.config.mjs"
      - "proxy.ts"
      - ".github/workflows/client-portal-build.yml"
  pull_request:
    paths:
      - "app/**"
      - "portal/**"
      - "public/**"
      - "package.json"
      - "next.config.ts"
      - "webflow.json"
      - "wrangler.json"
      - "tsconfig.json"
      - "postcss.config.mjs"
      - "proxy.ts"
      - ".github/workflows/client-portal-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZmFrZS5jbGVyay5hY2NvdW50cy5kZXYk
      CLERK_SECRET_KEY: sk_test_fake_for_build_only
      NEXT_PUBLIC_BASE_PATH: /portal
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build portal
        run: npm run build
