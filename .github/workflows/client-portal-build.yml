name: Client Portal Build

on:
  push:
    branches:
      - main
    paths:
      - "portal/**"
      - ".github/workflows/client-portal-build.yml"
  pull_request:
    paths:
      - "portal/**"
      - ".github/workflows/client-portal-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZmFrZS5jbGVyay5hY2NvdW50cy5kZXYk
      CLERK_SECRET_KEY: sk_test_fake_for_build_only
      NEXT_PUBLIC_BASE_PATH: /portal
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: portal
        run: npm install --no-audit --no-fund

      - name: Build portal
        working-directory: portal
        run: npm run build
