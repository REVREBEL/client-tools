name: Generate Client Hub auth locks

on:
  push:
    branches:
      - fix/client-hub-auth-route
    paths:
      - ".github/workflows/generate-client-hub-auth-locks.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/client-hub-auth-route
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 12.18.0
          run_install: false
      - name: Generate npm app lock
        working-directory: apps/client-hub-auth
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Refresh pnpm workspace lock
        run: pnpm install --lockfile-only
      - name: Commit locks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/client-hub-auth/package-lock.json pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "No lockfile changes."
            exit 0
          fi
          git commit -m "Generate Client Hub auth dependency locks"
          git push origin HEAD:fix/client-hub-auth-route
