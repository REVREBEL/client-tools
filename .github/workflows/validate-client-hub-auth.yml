name: Validate Client Hub auth app
# rerun after PostCSS fix

on:
  push:
    branches:
      - fix/client-hub-auth-route
    paths:
      - ".github/workflows/validate-client-hub-auth.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZmFrZS5jbGVyay5hY2NvdW50cy5kZXYk
      CLERK_SECRET_KEY: sk_test_fake_for_build_only
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: /client-hub/sign-in
      NEXT_PUBLIC_CLERK_SIGN_IN_FORCE_REDIRECT_URL: /client-hub
      NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL: /client-hub
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/client-hub-auth-route
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: npm ci
        working-directory: apps/client-hub-auth
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build
        working-directory: apps/client-hub-auth
        run: npm run build
