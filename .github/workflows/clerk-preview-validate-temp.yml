name: Validate Clerk Fumadocs preview (temporary)

on:
  push:
    branches:
      - test/clerk-fumadocs-preview

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: test/clerk-fumadocs-preview

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 12.18.0
          run_install: false

      - name: Refresh workspace lockfile
        run: pnpm install --lockfile-only

      - name: Commit lockfile update
        shell: bash
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "No lockfile change."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml
            git commit -m "Update pnpm lock for Clerk preview"
            git push
          fi

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Start Fumadocs dev server
        shell: bash
        run: |
          pnpm --filter @revrebel/design-system-docs dev > /tmp/clerk-preview.log 2>&1 &
          echo $! > /tmp/clerk-preview.pid
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3005/client-tools/docs/clerk-preview/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/clerk-preview.log
          exit 1

      - name: Smoke test every Clerk surface
        shell: bash
        run: |
          for surface in             sign-in             sign-up             waitlist             oauth-consent             choose-organization             reset-password             setup-mfa             user-profile
          do
            echo "Checking $surface"
            curl --fail --silent --show-error               "http://127.0.0.1:3005/client-tools/clerk-preview/$surface/" >/dev/null
          done

      - name: Install Chromium for visual snapshots
        run: pnpm --filter @revrebel/onboard exec playwright install chromium

      - name: Capture Clerk preview screenshots
        shell: bash
        run: |
          mkdir -p /tmp/clerk-preview-shots
          pnpm --filter @revrebel/onboard exec playwright screenshot --full-page \
            "http://127.0.0.1:3005/client-tools/docs/clerk-preview/" \
            /tmp/clerk-preview-shots/all-surfaces.png
          for surface in \
            sign-in \
            sign-up \
            waitlist \
            oauth-consent \
            choose-organization \
            reset-password \
            setup-mfa \
            user-profile
          do
            pnpm --filter @revrebel/onboard exec playwright screenshot --full-page \
              "http://127.0.0.1:3005/client-tools/clerk-preview/$surface/" \
              "/tmp/clerk-preview-shots/$surface.png"
          done

      - name: Upload Clerk preview screenshots
        uses: actions/upload-artifact@v6
        with:
          name: clerk-fumadocs-preview
          path: /tmp/clerk-preview-shots/*.png
          if-no-files-found: error

      - name: Show preview server log
        if: always()
        run: cat /tmp/clerk-preview.log || true
