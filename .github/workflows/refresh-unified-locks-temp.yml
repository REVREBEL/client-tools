name: Refresh unified lockfiles

on:
  push:
    branches:
      - chore/unify-pnpm-npm-lock-validation
    paths:
      - ".github/workflows/refresh-unified-locks-temp.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chore/unify-pnpm-npm-lock-validation
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 12.18.0
          run_install: false
      - name: Synchronize locks
        run: pnpm run locks:sync
      - name: Commit synchronized locks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml apps/*/package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes."
            exit 0
          fi
          git commit -m "Synchronize lockfiles after conflict resolution"
          git push origin HEAD:chore/unify-pnpm-npm-lock-validation
