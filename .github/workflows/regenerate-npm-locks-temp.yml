name: Regenerate npm lockfiles (temporary)

on:
  push:
    branches:
      - fix/lockfile-sync-end-to-end

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/lockfile-sync-end-to-end

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4
        with:
          version: 12.18.0
          run_install: false

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Regenerate npm-managed lockfiles
        run: pnpm run locks:sync

      - name: Commit regenerated lockfiles
        shell: bash
        run: |
          if git diff --quiet -- pnpm-lock.yaml 'apps/*/package-lock.json'; then
            echo "No lockfile changes generated."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml 'apps/*/package-lock.json'
          git commit -m "Sync npm lockfiles with pnpm resolutions"
          git push
