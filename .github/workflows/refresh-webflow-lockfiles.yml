name: Refresh Webflow npm lockfiles

on:
  push:
    branches:
      - chore/standardize-google-sheets-env
    paths:
      - "apps/docs/package.json"
      - "apps/metrics/package.json"
      - ".github/workflows/refresh-webflow-lockfiles.yml"

permissions:
  contents: write

jobs:
  refresh-lockfiles:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: chore/standardize-google-sheets-env

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Refresh Docs lockfile
        working-directory: apps/docs
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Refresh Metrics lockfile
        working-directory: apps/metrics
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit refreshed lockfiles
        run: |
          if git diff --quiet -- apps/docs/package-lock.json apps/metrics/package-lock.json; then
            echo "Lockfiles already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/docs/package-lock.json apps/metrics/package-lock.json
          git commit -m "Refresh Webflow npm lockfiles"
          git push origin HEAD:chore/standardize-google-sheets-env
